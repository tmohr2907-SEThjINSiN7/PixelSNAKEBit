<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Telegram Snake</title>
    <script src="https://telegram.org/js/games.js"></script>
    <style>
        * { box-sizing: border-box; touch-action: none; }
        body { 
            background: #0f172a; color: white; 
            display: flex; flex-direction: column; align-items: center; 
            margin: 0; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            height: 100vh; justify-content: center;
        }
        .header { margin-bottom: 10px; text-align: center; }
        #scoreVal { font-size: 2rem; font-weight: bold; color: #22c55e; }
        
        canvas { 
            border: 4px solid #334155; background: #000; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border-radius: 12px; max-width: 90vw;
        }

        /* Steuerkreuz für Mobile */
        .d-pad {
            display: grid;
            grid-template-columns: repeat(3, 75px);
            grid-template-rows: repeat(2, 75px);
            gap: 12px; margin-top: 25px;
        }
        .btn {
            width: 75px; height: 75px;
            background: #334155; border: none; border-radius: 18px;
            color: white; font-size: 1.5rem;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 0 #1e293b; transition: all 0.1s;
        }
        .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #1e293b; background: #475569; }
        .up { grid-column: 2; }
        .left { grid-column: 1; grid-row: 2; }
        .down { grid-column: 2; grid-row: 2; }
        .right { grid-column: 3; grid-row: 2; }
    </style>
</head>
<body>

    <div class="header">
        <div>SCORE</div>
        <div id="scoreVal">0</div>
    </div>

    <canvas id="gameCanvas" width="300" height="300"></canvas>

    <div class="d-pad">
        <button class="btn up" onpointerdown="changeDir(0, -20)">▲</button>
        <button class="btn left" onpointerdown="changeDir(-20, 0)">◀</button>
        <button class="btn down" onpointerdown="changeDir(0, 20)">▼</button>
        <button class="btn right" onpointerdown="changeDir(20, 0)">▶</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('scoreVal');

        let score = 0;
        const grid = 20;
        let snake = [{x: 100, y: 100}, {x: 80, y: 100}];
        let dx = grid, dy = 0;
        let food = {x: 200, y: 200};
        let gameActive = true;

        function changeDir(newDx, newDy) {
            if ((newDx === -dx && newDx !== 0) || (newDy === -dy && newDy !== 0)) return;
            dx = newDx;
            dy = newDy;
        }

        function draw() {
            if (!gameActive) return;

            // Hintergrund
            ctx.fillStyle = "black";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Essen
            ctx.fillStyle = "#ef4444";
            ctx.beginPath();
            ctx.roundRect(food.x, food.y, grid-2, grid-2, 5);
            ctx.fill();

            // Schlange bewegen
            const head = {x: snake[0].x + dx, y: snake[0].y + dy};
            snake.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreElement.innerText = score;
                spawnFood();
            } else {
                snake.pop();
            }

            // Kollisionsprüfung
            if (head.x < 0 || head.x >= canvas.width || head.y < 0 || head.y >= canvas.height || 
                snake.slice(1).some(p => p.x === head.x && p.y === head.y)) {
                gameActive = false;
                alert("Game Over! Score: " + score);
                location.reload(); 
            }

            // Schlange zeichnen
            ctx.fillStyle = "#22c55e";
            snake.forEach((part, i) => {
                ctx.globalAlpha = i === 0 ? 1 : 0.8;
                ctx.beginPath();
                ctx.roundRect(part.x, part.y, grid-2, grid-2, 4);
                ctx.fill();
            });

            setTimeout(draw, 120);
        }

        function spawnFood() {
            food.x = Math.floor(Math.random() * (canvas.width/grid)) * grid;
            food.y = Math.floor(Math.random() * (canvas.height/grid)) * grid;
        }

        // Tastatur für Desktop-Tests
        window.addEventListener('keydown', e => {
            if (e.key === "ArrowUp") changeDir(0, -grid);
            if (e.key === "ArrowDown") changeDir(0, grid);
            if (e.key === "ArrowLeft") changeDir(-grid, 0);
            if (e.key === "ArrowRight") changeDir(grid, 0);
        });

        draw();
    </script>
</body>
</html>
