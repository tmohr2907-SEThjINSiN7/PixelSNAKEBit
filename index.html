<!DOCTYPE html>
<html>
<head>
    <title>Telegram Snake Mobile</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://telegram.org/js/games.js"></script>
    <style>
        body { 
            background: #1a1a1a; color: white; 
            display: flex; flex-direction: column; align-items: center; 
            margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            touch-action: manipulation; /* Verhindert Zoom beim Tippen */
        }
        canvas { border: 4px solid #333; background: #000; margin-top: 10px; border-radius: 8px; }
        .score { font-size: 28px; margin: 15px; font-weight: bold; color: #4CAF50; }
        
        /* Steuerkreuz Styling */
        .controls {
            display: grid;
            grid-template-columns: repeat(3, 70px);
            grid-template-rows: repeat(2, 70px);
            gap: 10px;
            margin-top: 20px;
        }
        .btn {
            width: 70px; height: 70px;
            background: #444; border: none; border-radius: 50%;
            color: white; font-size: 24px; font-weight: bold;
            display: flex; align-items: center; justify-content: center;
            user-select: none; -webkit-tap-highlight-color: transparent;
        }
        .btn:active { background: #666; transform: scale(0.95); }
        .up { grid-column: 2; }
        .left { grid-column: 1; grid-row: 2; }
        .down { grid-column: 2; grid-row: 2; }
        .right { grid-column: 3; grid-row: 2; }
    </style>
</head>
<body>
    <div class="score">Score: <span id="scoreVal">0</span></div>
    <canvas id="snakeGame" width="300" height="300"></canvas>

    <div class="controls">
        <button class="btn up" onclick="changeDir(0, -20)">▲</button>
        <button class="btn left" onclick="changeDir(-20, 0)">◀</button>
        <button class="btn down" onclick="changeDir(0, 20)">▼</button>
        <button class="btn right" onclick="changeDir(20, 0)">▶</button>
    </div>

    <script>
        const canvas = document.getElementById('snakeGame');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('scoreVal');

        let score = 0;
        let grid = 20;
        let snake = [{x: 100, y: 100}, {x: 80, y: 100}];
        let dx = grid, dy = 0;
        let food = {x: 200, y: 200};

        function changeDir(newDx, newDy) {
            // Verhindern, dass man direkt in die entgegengesetzte Richtung läuft
            if ((newDx === -dx && newDx !== 0) || (newDy === -dy && newDy !== 0)) return;
            dx = newDx;
            dy = newDy;
        }

        function main() {
            if (isGameOver()) {
                alert("Game Over! Score: " + score);
                location.reload(); // Einfacher Neustart
                return;
            }
            setTimeout(() => {
                clearCanvas();
                drawFood();
                advanceSnake();
                drawSnake();
                main();
            }, 120);
        }

        function clearCanvas() {
            ctx.fillStyle = "black";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        function drawSnake() {
            ctx.fillStyle = "#4CAF50";
            snake.forEach(part => ctx.fillRect(part.x, part.y, grid-2, grid-2));
        }

        function advanceSnake() {
            const head = {x: snake[0].x + dx, y: snake[0].y + dy};
            snake.unshift(head);
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreElement.innerHTML = score;
                createFood();
            } else {
                snake.pop();
            }
        }

        function createFood() {
            food.x = Math.floor(Math.random() * (canvas.width/grid)) * grid;
            food.y = Math.floor(Math.random() * (canvas.height/grid)) * grid;
        }

        function drawFood() {
            ctx.fillStyle = "#FF5252";
            ctx.fillRect(food.x, food.y, grid-2, grid-2);
        }

        function isGameOver() {
            const head = snake[0];
            const hitWall = head.x < 0 || head.x >= canvas.width || head.y < 0 || head.y >= canvas.height;
            const hitSelf = snake.slice(1).some(part => part.x === head.x && part.y === head.y);
            return hitWall || hitSelf;
        }

        // Tastatur-Support bleibt erhalten
        window.addEventListener('keydown', e => {
            if (e.key === "ArrowUp") changeDir(0, -grid);
            if (e.key === "ArrowDown") changeDir(0, grid);
            if (e.key === "ArrowLeft") changeDir(-grid, 0);
            if (e.key === "ArrowRight") changeDir(grid, 0);
        });

        main();
    </script>
</body>
</html>
